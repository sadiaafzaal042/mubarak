<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمضان المبارک مبارک</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 15px 8px;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(135deg, #00291c, #087b50, #001a12);
}

.card {
  position: relative;
  max-width: 500px;
  min-height: 600px;
  margin: 20px auto;
  padding: 35px 18px;
  overflow: hidden;
  border: 3px solid #f6d777;
  border-radius: 25px;
  background: linear-gradient(160deg, #07583ceF, #00281eef);
  box-shadow: 0 0 25px #f6d77777;
}

h1 {
  color: #ffe38a;
  font-size: 36px;
  line-height: 1.7;
  text-shadow: 0 0 15px #f6d777;
}

.moon-big {
  font-size: 75px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 8px gold; }
  to { text-shadow: 0 0 30px gold; }
}

.decor {
  color: #ffdf7c;
  font-size: 23px;
  letter-spacing: 7px;
}

.message {
  margin: 25px 0;
  color: #fff4d0;
  font-size: 23px;
  line-height: 2.1;
  overflow-wrap: anywhere;
}

#senderName {
  display: block;
  width: 100%;
  margin: 20px 0;
  padding: 15px;
  border: 2px solid #f6d777;
  border-radius: 12px;
  background: white;
  color: #143d2b;
  font-size: 18px;
  text-align: right;
}

button {
  width: 100%;
  max-width: 350px;
  margin-top: 12px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.create-btn {
  color: #173b27;
  background: linear-gradient(90deg, #e8c45c, #fff0b0);
}

.whatsapp-btn {
  color: white;
  background: #25D366;
  box-shadow: 0 0 15px #25D36666;
}

.footer {
  margin-top: 25px;
  color: #ffe7a1;
}

/* پھولوں اور ستاروں کی برسات */
.rain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
}

.rain span {
  position: absolute;
  top: -35px;
  animation: fall 6s linear infinite;
  font-size: 22px;
}

.rain span:nth-child(1) { left: 5%; animation-delay: 0s; }
.rain span:nth-child(2) { left: 20%; animation-delay: 2s; }
.rain span:nth-child(3) { left: 35%; animation-delay: 1s; }
.rain span:nth-child(4) { left: 50%; animation-delay: 3s; }
.rain span:nth-child(5) { left: 65%; animation-delay: 1.5s; }
.rain span:nth-child(6) { left: 80%; animation-delay: 2.5s; }
.rain span:nth-child(7) { left: 95%; animation-delay: 0.5s; }

@keyframes fall {
  0% {
    transform: translateY(-20px) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: 1; }
  100% {
    transform: translateY(700px) rotate(360deg);
    opacity: 0;
  }
}

/* چاروں کونوں پر گھومتے چاند */
.corner-moon {
  position: absolute;
  z-index: 2;
  color: #ffe38a;
  font-size: 26px;
  text-shadow: 0 0 12px gold;
  animation: spin 4s linear infinite;
  pointer-events: none;
}

.top-left { top: 10px; left: 10px; }
.top-right { top: 10px; right: 10px; }
.bottom-left { bottom: 10px; left: 10px; }
.bottom-right { bottom: 10px; right: 10px; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* اصل مواد اینیمیشن کے اوپر رہے گا */
.content {
  position: relative;
  z-index: 1;
}
</style>
</head>

<body>

<div class="card">

  <div class="rain">
    <span>🌸</span>
    <span>⭐</span>
    <span>✨</span>
    <span>🌼</span>
    <span>🌟</span>
    <span>🌹</span>
    <span>✦</span>
  </div>

  <div class="corner-moon top-left">☾</div>
  <div class="corner-moon top-right">☾</div>
  <div class="corner-moon bottom-left">☾</div>
  <div class="corner-moon bottom-right">☾</div>

  <div class="content">

    <div class="decor">✦ ✧ ✦ ✧ ✦</div>

    <div class="moon-big">🌙</div>

    <h1>رمضان المبارک</h1>

    <div class="decor">🌟 ✨ 🌟</div>

    <p>اپنا نام لکھیں اور رمضان کی مبارک باد دیں:</p>

    <input
      type="text"
      id="senderName"
      placeholder="مثلاً: حافظ ساجد"
      maxlength="60"
    >

    <button class="create-btn" onclick="createGreeting()">
      ✨ میری مبارک باد تیار کریں
    </button>

    <div id="greeting" class="message" style="display:none;"></div>

    <button
      id="whatsappBtn"
      class="whatsapp-btn"
      onclick="shareWhatsApp()"
      style="display:none;"
    >
      📲 واٹس ایپ پر شیئر کریں
    </button>

    <div class="footer">
      🌸 اللہ تعالیٰ آپ سب کو خوشیاں اور برکتیں عطا فرمائے۔ آمین 🌸
    </div>

  </div>
</div>

<script>
let greetingMessage = "";

function createGreeting() {
  const name = document.getElementById("senderName").value.trim();

  if (!name) {
    alert("براہ کرم پہلے اپنا نام لکھیں۔");
    return;
  }

  greetingMessage =
    name + " کی طرف سے آپ کو اور آپ کے گھر والوں کو " +
    "رمضان کی آمد مبارک ہو۔ 🌙✨\n\n" +
    "اللہ تعالیٰ اس بابرکت مہینے میں آپ سب کو صحت، خوشیاں، " +
    "رحمتیں، برکتیں اور مغفرت عطا فرمائے۔ آمین یا رب العالمین۔ 🤲💚";

  document.getElementById("greeting").innerText = greetingMessage;
  document.getElementById("greeting").style.display = "block";
  document.getElementById("whatsappBtn").style.display = "block";
}

function shareWhatsApp() {
  if (!greetingMessage) {
    alert("پہلے اپنا نام لکھ کر مبارک باد تیار کریں۔");
    return;
  }

  const url = "https://wa.me/?text=" +
    encodeURIComponent(greetingMessage);

  window.open(url, "_blank");
}
</script>

</body>
</html>
