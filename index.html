<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربیع الاول مبارک ﷺ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(145deg, #003d2b, #087653, #012e24);
  padding: 25px 12px;
}

.border {
  position: fixed;
  inset: 7px;
  border: 3px solid #ffd76a;
  border-radius: 25px;
  pointer-events: none;
  box-shadow: 0 0 20px #ffd76a;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 10px #ffd76a; }
  to { box-shadow: 0 0 28px #fff0a0; }
}

.moon {
  font-size: 75px;
  margin-top: 15px;
  animation: float 3s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

.stars {
  color: #ffdc75;
  font-size: 27px;
  margin: 12px;
  letter-spacing: 8px;
}

h1 {
  color: #ffe28a;
  font-size: 35px;
  text-shadow: 0 0 15px #ffd76a;
  line-height: 1.7;
}

.card {
  max-width: 460px;
  margin: 25px auto;
  padding: 24px 18px;
  border: 1px solid #ffdc80;
  border-radius: 25px;
  background: #ffffff12;
  box-shadow: 0 0 25px #0003;
}

.message {
  font-size: 23px;
  line-height: 2;
}

.small {
  font-size: 17px;
  line-height: 1.9;
  color: #ffefbd;
}

input {
  width: 100%;
  padding: 16px 12px;
  border-radius: 14px;
  border: 2px solid #ffe28a;
  font-size: 18px;
  text-align: center;
  margin: 12px 0;
  outline: none;
}

button {
  width: 100%;
  padding: 17px 10px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px 0;
}

.create {
  background: #ffda70;
  color: #163b2a;
}

.share {
  background: #20bf65;
  color: white;
}

#result {
  display: none;
  padding: 15px;
  margin-top: 18px;
  background: #ffffff12;
  border: 1px solid #ffdc80;
  border-radius: 15px;
  line-height: 2;
  overflow-wrap: anywhere;
}

.footer {
  margin: 22px 0;
  color: #ffedbb;
  font-size: 15px;
}

.floating {
  position: fixed;
  top: -30px;
  animation: fall linear infinite;
  pointer-events: none;
  opacity: .8;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

</style>
</head>

<body>

<div class="border"></div>

<div class="moon">🌙</div>

<div class="stars">✦ ⭐ ✦ ⭐ ✦</div>

<h1>ربیع الاول مبارک ﷺ</h1>

<div class="card">

  <div class="message">
    💚 جشنِ آمدِ رسول ﷺ مبارک 💚
  </div>

  <p class="small">
    محبتِ رسول ﷺ ہمارے ایمان کی پہچان ہے۔
    <br>
    درود شریف پڑھیں اور دوسروں تک پہنچائیں۔
  </p>

  <input
    id="sender"
    type="text"
    maxlength="50"
    placeholder="اپنا نام لکھیں"
  >

  <input
    id="receiver"
    type="text"
    maxlength="50"
    placeholder="جسے مبارک باد دینی ہے اس کا نام"
  >

  <button class="create" onclick="makeGreeting()">
    ✨ مبارک باد تیار کریں
  </button>

  <div id="result"></div>

  <button
    class="share"
    id="shareBtn"
    onclick="shareGreeting()"
    style="display:none"
  >
    📲 واٹس ایپ پر شیئر کریں
  </button>

  <p class="small">
    ﷺ درود و سلام کی کثرت کریں ﷺ
  </p>

</div>

<div class="footer">
  💚 اللہ تعالیٰ ہم سب کو محبتِ رسول ﷺ نصیب فرمائے 💚
</div>

<script>
let greeting = "";

function makeGreeting() {
  const sender = document.getElementById("sender").value.trim();
  const receiver = document.getElementById("receiver").value.trim();

  if (!sender) {
    alert("براہ کرم اپنا نام لکھیں۔");
    return;
  }

  greeting =
    "🌙 ربیع الاول مبارک ﷺ 🌙\n\n" +
    (receiver ? receiver + " صاحب! " : "") +
    "آپ کو ربیع الاول مبارک ہو۔ 💚\n\n" +
    "اللہ تعالیٰ ہمیں نبی کریم ﷺ کی تعلیمات پر عمل کرنے کی توفیق عطا فرمائے۔ آمین 🤲\n\n" +
    "آپ کے لیے محبت بھرا پیغام بھیجا:\n" +
    "💚 " + sender + " 💚";

  const result = document.getElementById("result");
  result.innerText = greeting;
  result.style.display = "block";

  document.getElementById("shareBtn").style.display = "block";
}

function shareGreeting() {
  if (!greeting) {
    alert("پہلے مبارک باد تیار کریں۔");
    return;
  }

  const url =
    "https://wa.me/?text=" + encodeURIComponent(greeting);

  window.open(url, "_blank");
}

// خوبصورت گرتے ہوئے ستارے
for (let i = 0; i < 16; i++) {
  const star = document.createElement("div");
  star.className = "floating";
  star.innerText = ["✨", "⭐", "🌟"][i % 3];
  star.style.left = Math.random() * 100 + "vw";
  star.style.animationDuration = (5 + Math.random() * 8) + "s";
  star.style.animationDelay = Math.random() * 8 + "s";
  star.style.fontSize = (12 + Math.random() * 15) + "px";
  document.body.appendChild(star);
}
</script>

</body>
</html>
