<!DOCTYPE html><html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عید مبارک 🌙</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;text-align:center;
font-family:Arial,sans-serif;color:white;
background:linear-gradient(135deg,#061b35,#123d64,#30134d);
padding:25px 15px;overflow-x:hidden
}
.border{
position:fixed;inset:7px;border:3px solid #ffd76a;
border-radius:20px;pointer-events:none;
box-shadow:0 0 18px #ffd76a;animation:glow 2s infinite alternate
}
@keyframes glow{to{box-shadow:0 0 30px #ff9f43}}
.moon{font-size:75px;margin-top:25px}
h1{font-size:42px;color:#ffe28a;text-shadow:0 0 18px #ffc400}
.card{
max-width:440px;margin:20px auto;padding:25px 18px;
border:1px solid #ffdc80;border-radius:22px;
background:#ffffff12;box-shadow:0 0 25px #0005
}
input{
width:100%;padding:15px;border-radius:12px;
border:2px solid #ffe28a;font-size:18px;text-align:center;
margin:12px 0
}
button{
width:100%;padding:14px;margin-top:10px;
border:0;border-radius:12px;font-size:18px;
font-weight:bold;cursor:pointer
}
.create{background:#ffd76a;color:#17233a}
.share{background:#20bd68;color:white}
#message{font-size:24px;line-height:1.8;color:#fff0b4}
.star{font-size:24px;animation:twinkle 1.5s infinite alternate}
@keyframes twinkle{to{opacity:.35;transform:scale(1.2)}}
.small{font-size:14px;color:#ddd;line-height:1.8}
</style>
</head>
<body>
<div class="border"></div>
<div class="moon">🌙</div>
<div class="star">✨ ⭐ ✨ ⭐ ✨</div>
<h1>عید مبارک</h1>
<div class="card">
<div id="message">آپ کو اور آپ کے گھر والوں کو عید مبارک!</div>
<p>💖 اپنی طرف سے مبارک باد بھیجیں 💖</p>
<input id="name" maxlength="35" placeholder="یہاں اپنا نام لکھیں">
<button class="create" onclick="makeWish()">مبارک باد تیار کریں 🎉</button>
<button class="share" onclick="shareWish()">واٹس ایپ پر شیئر کریں 📲</button>
<p class="small">خوشیاں بانٹیں، محبت بڑھائیں ❤️</p>
</div>
<div class="star">🌟 ✨ 🌟 ✨ 🌟</div>
<script>
function makeWish(){
 const name=document.getElementById('name').value.trim();
 if(!name){alert('پہلے اپنا نام لکھیں');return}
 document.getElementById('message').textContent=
 name+' کی طرف سے آپ کو عید مبارک! 🌙🎉';
 const url=new URL(location.href);
 url.searchParams.set('name',name);
 history.replaceState(null,'',url);
}
function shareWish(){
 const name=document.getElementById('name').value.trim();
 if(!name){alert('پہلے اپنا نام لکھیں');return}
 const url=new URL(location.href);
 url.searchParams.set('name',name);
 const text=name+' کی طرف سے آپ کو عید مبارک! 🌙🎉\n'+url.href;
 window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
const sender=new URLSearchParams(location.search).get('name');
if(sender){
 document.getElementById('message').textContent=
 sender+' کی طرف سے آپ کو عید مبارک! 🌙🎉';
}
</script>
</body>
</html>
